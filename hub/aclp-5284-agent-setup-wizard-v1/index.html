<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ACLP-5284 hub-agent 설정 마법사</title>
<style>
:root {
  color-scheme: light;
  --ink: #1a1a2e;
  --ink-2: #475569;
  --ink-3: #64748b;
  --line: #e2e8f0;
  --line-2: #cbd5e1;
  --ground: #e9ecf1;
  --surface: #ffffff;
  --soft: #f4f6f9;
  --primary: #0f3460;
  --primary-hover: #0a2848;
  --primary-soft: #e8eef6;
  --ok: #059669;
  --ok-soft: #ecfdf5;
  --fail: #dc2626;
  --fail-soft: #fef2f2;
  --warn: #b45309;
  --warn-soft: #fffbeb;
  --note: #6d28d9;
  --note-soft: #f5f3ff;
}
* { box-sizing: border-box; }
body {
  background: var(--ground);
  color: var(--ink);
  font-family: 'Segoe UI', 'Malgun Gothic', '맑은 고딕', -apple-system, 'Apple SD Gothic Neo', sans-serif;
  font-size: 14px;
  padding: 24px 16px 48px;
}
.page { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

/* ── 목업 컨트롤 바 ── */
.ctl { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; }
.ctl h1 { font-size: 18px; margin: 0; margin-right: auto; letter-spacing: -0.3px; }
.ctl h1 small { font-size: 12px; font-weight: 400; color: var(--ink-3); margin-left: 6px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 6px; font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.seg button.on { background: var(--primary); color: #fff; }
.seg-label { font-size: 12px; color: var(--ink-3); margin-right: 6px; }
.ctl-group { display: flex; align-items: center; }

.stage { display: grid; grid-template-columns: minmax(0, 900px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1100px) { .stage { grid-template-columns: minmax(0, 1fr); } }

/* ── 앱 창 프레임 (900 × 640) ── */
.win { width: 100%; max-width: 900px; aspect-ratio: 900 / 672; min-height: 560px; background: var(--surface); border: 1px solid #9aa4b2; border-radius: 6px; box-shadow: 0 10px 30px rgba(15, 52, 96, 0.15); display: flex; flex-direction: column; overflow: hidden; position: relative; }
.titlebar { height: 32px; flex-shrink: 0; background: #f8fafc; border-bottom: 1px solid var(--line); display: flex; align-items: center; padding: 0 10px; font-size: 12px; color: var(--ink-2); gap: 8px; }
.titlebar .dots { margin-left: auto; display: flex; gap: 14px; color: var(--ink-3); }
.app { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
.nav { height: 48px; background: #1a1a2e; display: flex; align-items: center; gap: 4px; padding: 0 16px; flex-shrink: 0; }
.nav b { color: #e2e8f0; font-size: 15px; margin-right: auto; }
.nav span { color: #94a3b8; font-size: 13px; padding: 6px 12px; border-radius: 4px; }
.nav span.on { background: #334155; color: #fff; }
.settings { flex: 1; overflow: hidden; padding: 16px 20px; background: #f0f2f5; display: flex; flex-direction: column; gap: 12px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line-2); }
.tabs span { padding: 8px 14px; font-size: 13px; color: var(--ink-3); }
.tabs span.on { color: var(--primary); border-bottom: 2px solid var(--primary); font-weight: 600; }
.wizard-entry { display: flex; align-items: center; gap: 12px; background: var(--primary-soft); border: 1px solid #c7d6ea; border-radius: 8px; padding: 12px 14px; }
.wizard-entry p { margin: 0; flex: 1; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.wizard-entry p b { color: var(--ink); display: block; font-size: 14px; }
.fake-form { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; grid-template-columns: 140px 1fr; gap: 10px 12px; align-items: center; font-size: 13px; }
.fake-form label { color: #374151; font-weight: 600; }
.fake-input { border: 1px solid var(--line-2); border-radius: 4px; padding: 6px 8px; font-family: Consolas, 'Courier New', monospace; font-size: 12px; color: var(--ink-2); background: #fff; min-height: 30px; overflow-wrap: anywhere; }
.fake-input.filled { background: #fefce8; border-color: #eab308; color: var(--ink); }
.fake-input.empty { color: #a3acb9; }

.btn { border: 0; border-radius: 6px; font: inherit; font-weight: 600; cursor: pointer; padding: 8px 14px; font-size: 13px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
.btn-primary:disabled { background: #a8b6c8; cursor: not-allowed; }
.btn-ghost { background: transparent; color: var(--ink-2); }
.btn-ghost:hover { background: var(--soft); }
.btn-line { background: var(--surface); color: var(--primary); border: 1px solid #b9c7da; }
.btn:focus-visible, .card:focus-visible, .seg button:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }

/* ── 마법사 모달 (창 전체를 덮음) ── */
.wz { position: absolute; inset: 0; background: var(--surface); display: flex; flex-direction: column; z-index: 5; }
.wz-top { height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.wz-top .back { width: 32px; height: 32px; padding: 0; font-size: 18px; line-height: 1; }
.wz-top .title { font-size: 13px; color: var(--ink-3); font-weight: 600; }
.wz-top .close { margin-left: auto; font-size: 13px; }
.progress { height: 4px; background: var(--line); flex-shrink: 0; }
.progress i { display: block; height: 100%; background: var(--primary); }
.wz-body { flex: 1; overflow-y: auto; padding: 32px 0 24px; }
.wz-inner { max-width: 560px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 20px; }
.step-no { font-size: 13px; color: var(--primary); font-weight: 700; font-variant-numeric: tabular-nums; }
.q { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.35; margin: 0; }
.sub { font-size: 14px; color: var(--ink-3); line-height: 1.6; margin: -8px 0 0; }
.wz-foot { flex-shrink: 0; padding: 14px 24px 18px; border-top: 1px solid var(--line); }
.wz-foot .btn { width: 100%; max-width: 512px; display: block; margin: 0 auto; padding: 14px; font-size: 15px; border-radius: 8px; }

.cards { display: flex; flex-direction: column; gap: 10px; }
.cards.two { display: grid; grid-template-columns: 1fr 1fr; }
@media (max-width: 520px) { .cards.two { grid-template-columns: 1fr; } }
.card { text-align: left; width: 100%; font: inherit; color: inherit; background: var(--surface); border: 1.5px solid var(--line-2); border-radius: 10px; padding: 16px; cursor: pointer; display: flex; gap: 12px; align-items: flex-start; }
.card:hover { border-color: #8aa0bd; }
.card.on { border-color: var(--primary); background: var(--primary-soft); }
.card .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--line-2); flex-shrink: 0; margin-top: 1px; position: relative; }
.card.on .radio { border-color: var(--primary); }
.card.on .radio::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--primary); }
.card .ct { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.card .ct b { font-size: 15px; }
.card .ct span { font-size: 13px; color: var(--ink-3); line-height: 1.5; }
.card .ct code { font-family: Consolas, 'Courier New', monospace; font-size: 12px; color: var(--ink-2); background: var(--soft); padding: 2px 6px; border-radius: 4px; align-self: flex-start; overflow-wrap: anywhere; }
.card .tag { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--ok); background: var(--ok-soft); border-radius: 999px; padding: 3px 8px; flex-shrink: 0; }

.pick { display: flex; flex-direction: column; gap: 8px; }
.pick-row { display: flex; gap: 8px; }
.pick-path { flex: 1; min-width: 0; border: 1.5px solid var(--line-2); border-radius: 8px; padding: 12px 14px; font-family: Consolas, 'Courier New', monospace; font-size: 13px; background: var(--soft); overflow-wrap: anywhere; }
.pick-path.set { background: var(--surface); border-color: var(--primary); color: var(--ink); }
.pick-path.unset { color: #a3acb9; }
.pick-row .btn { flex-shrink: 0; padding: 0 18px; font-size: 14px; border-radius: 8px; }
.hint { font-size: 13px; line-height: 1.55; padding: 10px 12px; border-radius: 8px; display: flex; gap: 8px; }
.hint.ok { background: var(--ok-soft); color: #065f46; }
.hint.info { background: var(--soft); color: var(--ink-2); }
.hint.warn { background: var(--warn-soft); color: var(--warn); }
.text-in { width: 100%; border: 1.5px solid var(--line-2); border-radius: 8px; padding: 12px 14px; font: inherit; font-size: 14px; }
.text-in:focus { outline: none; border-color: var(--primary); }
.text-in.mono { font-family: Consolas, 'Courier New', monospace; font-size: 13px; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld label { font-size: 13px; font-weight: 600; color: var(--ink-2); }

.files { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.files-h { background: var(--soft); padding: 8px 12px; font-size: 12px; color: var(--ink-3); display: flex; justify-content: space-between; }
.files-h b { color: var(--ok); }
.file { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-top: 1px solid var(--line); font-family: Consolas, 'Courier New', monospace; font-size: 12.5px; }
.file .mk { width: 18px; font-family: 'Segoe UI', sans-serif; font-weight: 700; text-align: center; }
.file.y .mk { color: var(--ok); }
.file.n { color: #a3acb9; }
.file.n .why { margin-left: auto; font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; font-size: 11px; }

.path-preview { font-family: Consolas, 'Courier New', monospace; font-size: 13px; background: #1a1a2e; color: #e2e8f0; padding: 12px 14px; border-radius: 8px; line-height: 1.6; overflow-wrap: anywhere; }
.path-preview em { font-style: normal; color: #fbbf24; }
.path-cap { font-size: 12px; color: var(--ink-3); }

.checks { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.chk { display: flex; gap: 12px; padding: 14px 16px; align-items: flex-start; }
.chk + .chk { border-top: 1px solid var(--line); }
.chk .ic { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #fff; background: var(--line-2); }
.chk.ok .ic { background: var(--ok); }
.chk.fail .ic { background: var(--fail); }
.chk.wait .ic { background: var(--line-2); color: var(--ink-3); }
.chk .ct { display: flex; flex-direction: column; gap: 3px; }
.chk .ct b { font-size: 14px; }
.chk .ct span { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
.chk.fail { background: var(--fail-soft); }
.chk.fail .ct span { color: #991b1b; }
.fix { background: var(--fail-soft); border: 1px solid #fecaca; border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.fix b { font-size: 14px; color: #991b1b; }
.fix p { margin: 0; font-size: 13px; color: #7f1d1d; line-height: 1.6; }
.fix .row { display: flex; gap: 8px; flex-wrap: wrap; }

.summary { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.sum-row { display: grid; grid-template-columns: 120px 1fr auto; gap: 12px; padding: 12px 16px; align-items: baseline; }
.sum-row + .sum-row { border-top: 1px solid var(--line); }
.sum-row .k { font-size: 13px; color: var(--ink-3); }
.sum-row .v { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.sum-row .v small { display: block; font-weight: 400; font-family: Consolas, 'Courier New', monospace; font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.sum-row .ed { font-size: 12px; color: var(--primary); background: none; border: 0; cursor: pointer; font-weight: 600; padding: 2px 4px; }
@media (max-width: 520px) { .sum-row { grid-template-columns: 1fr auto; } .sum-row .k { grid-column: 1 / -1; } }

.done { text-align: center; align-items: center; padding-top: 48px; }
.done .big { width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 32px; display: flex; align-items: center; justify-content: center; font-weight: 700; }

.types { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
@media (max-width: 520px) { .types { grid-template-columns: 1fr; } }
.types .card { padding: 12px 14px; align-items: center; }
.types .card .ct b { font-size: 14px; }

/* ── 오른쪽 설명 패널 ── */
.notes { display: flex; flex-direction: column; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.panel h2 { font-size: 13px; margin: 0; color: var(--ink-3); letter-spacing: 0.4px; }
.steplist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.steplist button { width: 100%; text-align: left; border: 0; background: transparent; font: inherit; font-size: 13px; padding: 7px 8px; border-radius: 6px; cursor: pointer; display: flex; gap: 8px; color: var(--ink-2); }
.steplist button:hover { background: var(--soft); }
.steplist button.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.steplist .n { width: 18px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.steplist .opt { margin-left: auto; font-size: 11px; color: var(--ink-3); font-weight: 400; }
.fieldmap { font-size: 13px; line-height: 1.6; color: var(--ink-2); display: flex; flex-direction: column; gap: 6px; }
.fieldmap code { font-family: Consolas, 'Courier New', monospace; font-size: 12px; background: var(--note-soft); color: var(--note); padding: 1px 6px; border-radius: 4px; }
.fieldmap p { margin: 0; }
.legend { font-size: 12px; color: var(--ink-3); line-height: 1.6; margin: 0; }
.legend i { display: inline-block; width: 10px; height: 10px; background: #fefce8; border: 1px solid #eab308; vertical-align: -1px; margin-right: 4px; }
</style>

</head><body><div class="page">
  <div class="ctl">
    <h1>설정 마법사 목업 <small>창 크기 900 × 640 기준 · 클릭해서 넘겨 보세요</small></h1>
    <div class="ctl-group"><span class="seg-label">모드</span>

        <h2>읽는 법</h2>
        <p class="legend">마법사를 닫으면 뒤의 기존 설정 화면이 보입니다. <i></i>노란 칸이 마법사가 저장한 값입니다. 진행 표시와 이전/다음 버튼만 두고 애니메이션은 넣지 않았습니다.</p>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var S = {
    mode: 'copy', existing: 'yes', result: 'ok',
    step: 0, open: false, saved: false,
    // 복사
    watchDir: '', where: 'root', pickedFile: '', filePreset: 0, collect: 'single',

    existingAction: 'replace',
    // 업로드
    srcDir: '', agentType: 'EXBODY_MOTION', env: 'prod', token: '',

  };

  var FILE_PRESETS = [
    { label: 'ID + 이름 + 번호', ex: 'A-1001_홍길동_260922.pdf', pat: '[a-zA-Z0-9-]{1,20}[\\s_]+[a-zA-Z가-힣]{1,20}[\\s_]+[0-9]{1,20}\\.[^./]+' },

  ];
  var AGENT_TYPES = [
    ['GILON_PLANTAR', '길온 족저압'], ['EXBODY_MOTION', 'EXBODY 동작분석'], ['EXBODY_SURFACE', 'EXBODY 표면근전도'],

    ['VALD_ISOMETRIC', 'VALD 등척성'], ['BODY_COMPOSITION', '인바디/아큐닉 체성분'], ['HUMAC_ISOKINETIC', 'HUMAC 등속성'],
    ['HUMAC_STATIC_BALANCE', 'HUMAC 정적균형'], ['DYNAMIC_BALANCE', '동적 체평형']
  ];
  var ENVS = { prod: ['운영 서버', 'https://api.example.com/agents/files/', '병원 현장은 이걸 고르세요'],
               staging: ['테스트 서버', 'https://staging-api.example.com/agents/files/', '설치 점검용'],
               dev: ['개발 서버', 'https://dev-api.example.com/agents/files/', '개발자 전용'] };
  var SAMPLE_FILES = [

  ];
  var TODAY = '2026-10-07';

  // ── 단계 정의 ──
  function copySteps() {
    var s = [];
    if (S.existing === 'yes') s.push({ id: 'existing', name: '기존 규칙 처리', opt: '규칙 있을 때만' });

  function uploadSteps() {

    return s;
  }

  function checkView(n, total) {
    var isCopy = S.mode === 'copy';
    var items = isCopy ? [
      ['지켜볼 폴더 읽기', S.watchDir || 'C:\\EXBODY\\Export'],
      ['공유 폴더 접속', S.target || '\\\\hosp-nas\\exbody'],
      ['공유 폴더에 쓰기', '서비스 계정(actimedi)으로 시험 파일을 만들었다 지웠어요']
    ] : [
      ['공유 폴더 읽기', S.srcDir || '\\\\hosp-nas\\exbody'],
      ['서버 접속', ENVS[S.env][1]],
      ['연결 키 확인', '서버가 연결 키를 받아들였어요']
    ];
    var failAt = S.result === 'ok' ? -1 : (isCopy ? (S.result === '1326' ? 1 : 2) : (S.result === '1326' ? 0 : 0));
    var rows = items.map(function (it, i) {
      var st;
      if (S.checking < i + 1) st = 'wait';
      else if (i === failAt) st = 'fail';
      else if (failAt >= 0 && i > failAt) st = 'wait';
      else st = 'ok';
      var desc = it[1];
      if (st === 'fail') desc = S.result === '1326'
        ? '로그온 실패 (1326) · 이 PC의 서비스 계정 비밀번호가 ' + (isCopy ? '공유 폴더 서버' : '공유 폴더 서버') + '와 달라요'
        : '액세스 거부 (5) · 서비스 계정에 이 폴더 ' + (isCopy ? '쓰기' : '읽기') + ' 권한이 없어요';
      if (st === 'wait' && S.checking >= i + 1) desc = '앞 단계가 실패해서 확인하지 않았어요';
      return '<div class="chk ' + st + '"><span class="ic">' + (st === 'ok' ? '✓' : st === 'fail' ? '!' : '') + '</span><span class="ct"><b>' + it[0] + '</b><span>' + esc(desc) + '</span></span></div>';
    }).join('');
    var finished = S.checking >= items.length || (failAt >= 0 && S.checking > failAt);
    var fix = '';
    if (finished && failAt >= 0) {
      fix = S.result === '1326'
        ? '<div class="fix"><b>이 PC에서 고칠 수 있어요</b><p>서비스 계정 비밀번호를 서버와 다시 맞추면 해결돼요. 관리자 권한이 필요해요.</p><div class="row"><button class="btn btn-primary">자동 복구 실행</button><button class="btn btn-line">단계별 명령 보기</button></div></div>'
        : '<div class="fix"><b>서버 관리자에게 요청해야 해요</b><p>이 PC에서는 고칠 수 없어요. 공유 폴더 서버에서 <b>actimedi</b> 계정에 “' + (isCopy ? '수정' : '읽기') + '” 권한을 줘야 해요.</p><div class="row"><button class="btn btn-line">요청 내용 복사</button><button class="btn btn-ghost">진단 화면 열기</button></div></div>';
    }
    return head(n, total, finished ? (failAt >= 0 ? '연결에 문제가 있어요' : '모두 정상이에요') : '연결을 확인하고 있어요',
      finished ? (failAt >= 0 ? '저장은 할 수 있지만, 고치기 전에는 파일이 ' + (isCopy ? '복사' : '전송') + '되지 않아요.' : '설정한 대로 실제 파일을 보낼 수 있어요.') : '실제 서비스 권한으로 확인해요. 몇 초 걸려요.') +
      '<div class="checks">' + rows + '</div>' + fix +
      (finished ? '' : '<button class="btn btn-line" data-act="runcheck" style="align-self:flex-start">확인 진행 (목업: 한 단계씩)</button>');
  }

  function summaryView(n, total) {
    var isCopy = S.mode === 'copy', st = steps();
    function idx(id) { for (var i = 0; i < st.length; i++) if (st[i].id === id) return i; return 0; }
    function row(k, v, small, id) {
      return '<div class="sum-row"><span class="k">' + k + '</span><span class="v">' + v + (small ? '<small>' + esc(small) + '</small>' : '') + '</span><button class="ed" data-go="' + idx(id) + '">바꾸기</button></div>';
    }
    var whereLbl = { today: '오늘 날짜 폴더 안', alldates: '모든 날짜 폴더 안', root: '폴더 바로 안' }[S.where];
    var rows = isCopy ? [
      row('지켜볼 폴더', whereLbl, S.watchDir || 'C:\\EXBODY\\Export', 'watch'),
      row('보낼 파일', FILE_PRESETS[S.filePreset].label, '예: ' + FILE_PRESETS[S.filePreset].ex, 'file'),
      row('보내는 방식', S.collect === 'single' ? '하나씩 바로' : '묶어서 zip', '', 'collect'),
      row('보낼 곳', S.dateSplit === 'yes' ? '날짜별 폴더로' : '한 폴더에', targetPath() || '\\\\hosp-nas\\exbody\\' + TODAY, 'target')
    ] : [
      row('지켜볼 폴더', '공유 폴더', S.srcDir || '\\\\hosp-nas\\exbody', 'src'),
      row('검사 종류', AGENT_TYPES.filter(function (t) { return t[0] === S.agentType; })[0][1], '', 'type'),
      row('보낼 파일', FILE_PRESETS[S.filePreset].label, '예: ' + FILE_PRESETS[S.filePreset].ex, 'file'),
      row('서버', ENVS[S.env][0], ENVS[S.env][1], 'server'),
      row('연결 키', S.token ? '입력함' : '입력함', '', 'token')
    ];
    var warn = S.result !== 'ok' ? '<div class="hint warn">! 연결 확인에서 문제가 있었어요. 저장 후 진단 화면에서 이어서 고칠 수 있어요.</div>' : '';
    var ex = S.existing === 'yes' ? '<div class="hint info">기존 ' + (isCopy ? '규칙' : '항목') + ' 2개를 ' + (S.existingAction === 'replace' ? '이번 설정으로 바꿔요.' : '그대로 두고 하나를 추가해요.') + '</div>' : '';
    return head(n, total, '이대로 저장할까요?') + '<div class="summary">' + rows.join('') + '</div>' + ex + warn +
      (isCopy ? '' : '<button class="btn btn-ghost" style="align-self:flex-start;padding-left:0">+ 다른 검사 종류도 추가하기</button>');
  }

  function canNext(id) {
    if (id === 'watch') return !!S.watchDir;
    if (id === 'src') return !!S.srcDir;
    if (id === 'file') return true;
    if (id === 'target') return !!S.target;
    if (id === 'token') return !!S.token;
    if (id === 'check') {
      var len = 3, failAt = S.result === 'ok' ? -1 : (S.mode === 'copy' ? (S.result === '1326' ? 1 : 2) : 0);
      return S.checking >= len || (failAt >= 0 && S.checking > failAt);
    }
    return true;
  }
  function nextLabel(id) {
    if (id === 'check') return S.result === 'ok' ? '다음' : '문제는 나중에 고치고 계속';
    if (id === 'summary') return S.mode === 'copy' ? '저장하고 복사 시작하기' : '저장하고 전송 시작하기';
    if (id === 'done') return '닫기';
    return '다음';
  }

  // ── 렌더 ──
  var $wz = document.getElementById('wz'), $set = document.getElementById('settings'),
      $list = document.getElementById('steplist'), $map = document.getElementById('fieldmap');

  function renderSettings() {
    var isCopy = S.mode === 'copy', f = S.saved;
    function inp(label, val, empty) {
      return '<label>' + label + '</label><div class="fake-input ' + (f ? 'filled' : (empty ? 'empty' : '')) + '">' + esc(f ? val : (empty || val)) + '</div>';
    }
    var form = isCopy
      ? inp('감시 폴더', S.watchDir || 'C:\\EXBODY\\Export', '(비어 있음)') +
        inp('하위 폴더 패턴', S.where === 'today' ? '$TODAY' : S.where === 'alldates' ? '(\\d{4})-(\\d{2})-(\\d{2})' : '', '(비어 있음)') +
        inp('파일 패턴', FILE_PRESETS[S.filePreset].pat, '(비어 있음)') +
        inp('수집 방식', S.collect, 'single') +
        inp('복사 대상 폴더', S.target || '\\\\hosp-nas\\exbody', '(비어 있음)') +
        inp('대상 하위 패턴', S.dateSplit === 'yes' ? '$TODAY' : '', '(비어 있음)')
      : inp('공유 폴더', S.srcDir || '\\\\hosp-nas\\exbody', '(비어 있음)') +
        inp('파일 타입', S.agentType, '(비어 있음)') +
        inp('파일 패턴', FILE_PRESETS[S.filePreset].pat, '(비어 있음)') +
        inp('서버 URL', ENVS[S.env][1], '(비어 있음)') +
        inp('Bearer Token', '••••••••••••', '(비어 있음)');
    $set.innerHTML =
      '<div class="tabs"><span class="' + (isCopy ? 'on' : '') + '">모드1 · 복사</span><span class="' + (isCopy ? '' : 'on') + '">모드2 · 업로드</span><span>고급</span></div>' +
      '<div class="wizard-entry"><p><b>' + (f ? '마법사로 저장한 설정이에요' : '설정이 어려우신가요?') + '</b>' +
      (f ? '노란 칸이 이번에 저장된 값이에요. 여기서 직접 고칠 수도 있어요.' : '질문에 하나씩 답하면 아래 설정이 자동으로 채워져요.') + '</p>' +
      '<button class="btn btn-primary" data-act="open">설정 마법사' + (f ? ' 다시 하기' : '') + '</button></div>' +
      '<div class="fake-form">' + form + '</div>';
  }

  function renderWizard() {
    var st = steps();
    if (S.step >= st.length) S.step = st.length - 1;
    var cur = st[S.step];
    $wz.hidden = !S.open;
    if (S.open) {
      var counted = st.filter(function (s) { return s.id !== 'done'; }).length;
      var n = Math.min(S.step + 1, counted);
      var pct = cur.id === 'done' ? 100 : Math.round(S.step / counted * 100);
      var body = cur.id === 'done' ? view('done') : '<div class="wz-inner">' + view(cur.id, n, counted) + '</div>';
      $wz.innerHTML =
        '<div class="wz-top">' + (S.step > 0 && cur.id !== 'done' ? '<button class="btn btn-ghost back" data-act="prev" aria-label="이전">‹</button>' : '') +
        '<span class="title">' + (S.mode === 'copy' ? '복사 설정 마법사' : '업로드 설정 마법사') + '</span>' +
        (cur.id !== 'done' ? '<button class="btn btn-ghost close" data-act="close">닫기</button>' : '') + '</div>' +
        '<div class="progress"><i style="width:' + pct + '%"></i></div>' +
        '<div class="wz-body">' + body + '</div>' +
        '<div class="wz-foot"><button class="btn btn-primary" data-act="next"' + (canNext(cur.id) ? '' : ' disabled') + '>' + nextLabel(cur.id) + '</button></div>';
    }
    $list.innerHTML = st.map(function (s, i) {
      return '<li><button data-go="' + i + '" class="' + (S.open && i === S.step ? 'on' : '') + '"><span class="n">' + (s.id === 'done' ? '✓' : i + 1) + '</span>' + s.name + (s.opt ? '<span class="opt">' + s.opt + '</span>' : '') + '</button></li>';
    }).join('');
    $map.innerHTML = S.open ? (FIELDS[cur.id] || '') : '<p>오른쪽 위 “설정 마법사” 버튼을 누르거나 단계 바로가기에서 하나를 고르세요.</p><p>마법사를 마치면 기존 설정 화면의 칸들이 채워집니다.</p>';
  }

  function render() { renderSettings(); renderWizard(); }

  // ── 이벤트 ──
  var PICKS = { watchDir: 'C:\\EXBODY\\Export', srcDir: '\\\\hosp-nas\\exbody', pickedFile: 'A-1001_홍길동_260922.pdf' };

  document.addEventListener('click', function (e) {
    var t = e.target.closest('button');
    if (!t) return;
    var seg = t.closest('.seg');
    if (seg) {
      var key = { 'seg-mode': 'mode', 'seg-existing': 'existing', 'seg-result': 'result' }[seg.id];
      S[key] = t.getAttribute('data-v');
      seg.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b === t); });
      if (key === 'mode' || key === 'existing') { S.step = 0; S.saved = false; }
      S.checking = 0;
      render(); return;
    }
    if (t.hasAttribute('data-set')) {
      var g = t.getAttribute('data-set'), v = t.getAttribute('data-val');
      S[g] = g === 'filePreset' ? Number(v) : v;
      render(); return;
    }
    if (t.hasAttribute('data-pick')) {
      var k = t.getAttribute('data-pick');
      S[k] = PICKS[k];
      if (k === 'pickedFile') S.filePreset = 0;
      render(); return;
    }
    if (t.hasAttribute('data-go')) {
      S.open = true; S.step = Number(t.getAttribute('data-go'));
      if (steps()[S.step].id === 'check') S.checking = 0;
      render(); return;
    }
    var act = t.getAttribute('data-act');
    if (act === 'open') { S.open = true; S.step = 0; S.checking = 0; render(); }
    else if (act === 'close') { S.open = false; render(); }
    else if (act === 'prev') { S.step = Math.max(0, S.step - 1); if (steps()[S.step].id === 'check') S.checking = 0; render(); }
    else if (act === 'runcheck') { S.checking++; render(); }
    else if (act === 'next') {
      var cur = steps()[S.step].id;
      if (cur === 'done') { S.open = false; render(); return; }
      if (cur === 'summary') S.saved = true;
      S.step++;
      if (steps()[S.step].id === 'check') S.checking = 0;
      render();
    }
  });
  document.addEventListener('input', function (e) {
    var b = e.target.getAttribute && e.target.getAttribute('data-bind');
    if (!b) return;
    S[b] = e.target.value;
    var btn = $wz.querySelector('[data-act="next"]');
    if (btn) btn.disabled = !canNext(steps()[S.step].id);
  });

  // 처음 보는 사람이 바로 흐름을 볼 수 있게 마법사를 열어 둔 상태로 시작
  S.open = true;
  render();
})();
</script>
</body></html>
