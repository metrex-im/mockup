let S = {caseKey:"first-op",modalOpen:false,tab:"review",picks:{},edits:{},editingQ:null,sel:null,holdOpen:false,reviewDone:false,sent:false};
const C = () => CASES[S.caseKey];
const ck = id => S.caseKey + "." + id;
const qDef = id => C().questions.find(q => q.id === id);
const qVal = id => { const p = S.picks[ck(id)]; return p === undefined ? qDef(id).ai : p; };
const qChanged = id => S.picks[ck(id)] !== undefined;
const locked = () => S.reviewDone && !S.sent;
const fDef = id => id.indexOf("todo") === 0 ? C().fields.todos[+id.slice(4)] : C().fields[id];
const fVal = id => {
  const d = fDef(id);
  if (d.bindQ) { const v = qVal(d.bindQ); if (v) return v; }
  const e = S.edits[ck(id)];
  return e === undefined ? d.value : e;
};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const selSrc = () => S.sel ? fDef(S.sel).src : [];

function srcText(id){
  const d = fDef(id), c = C();
  const q = c.questions.find(x => d.src.indexOf(x.id) >= 0);
  const l = c.transcript.find(x => d.src.indexOf(x.id) >= 0);
  let s = "";
  if (q) s = q.no + " " + q.text + " → " + (qVal(q.id) || "답변 없음");
  if (l) s = s ? s + " · 발화 “" + l.text + "”" : "발화 “" + l.text + "”";
  return s || d.note;
}
function edited(id){
  const d = fDef(id);
  return S.edits[ck(id)] !== undefined || (d.bindQ && qChanged(d.bindQ));
}

function chipsHtml(q, v, small){
  const lk = locked();
  return '<div class="chips">' + q.options.map(o => {
    const on = o === v, ai = on && !qChanged(q.id);
    return '<button class="chip' + (on ? (ai ? " aion" : " on") : "") + '"' + (lk ? " disabled" : "") +
      ' data-act="pick" data-q="' + q.id + '" data-o="' + esc(o) + '"' +
      (small ? ' style="padding:8px 13px"' : "") + '>' + esc(o) + '</button>';
  }).join("") + '</div>';
}

function qCard(q, inModal){
  const v = qVal(q.id), changed = qChanged(q.id), ai = !!v && !changed;
  const hit = selSrc().indexOf(q.id) >= 0;
  const ev = q.ev ? C().transcript.find(l => l.id === q.ev) : null;
  const feed = q.feeds.length ? "→ " + q.feeds.map(f => BLOCK[f]).join(" · ") : "리포트 미반영";
  let h = '<div class="q ' + (hit ? "hit" : (ai ? "ai" : (v ? "doc" : ""))) + '">';
  h += '<div class="qtop"><span class="qno">' + q.no + '</span>';
  h += '<div class="qt" data-act="focus" data-q="' + q.id + '">' + esc(q.text) + '</div>';
  if (!inModal) h += '<span class="feed' + (q.feeds.length ? "" : " no") + '">' + esc(feed) + '</span>';
  if (inModal && !locked()) h += '<button class="edit" data-act="edit" data-q="' + q.id + '">' + (S.editingQ === q.id ? "완료" : "수정") + '</button>';
  h += '</div><div class="qbody">';
  if (v) {
    h += '<div class="tagrow"><span class="ttag ' + (ai ? "ai" : "doc") + '">' + (ai ? "AI 제안 · " + q.conf + "%" : "의사 선택") + '</span>';
    if (!locked() && !inModal) h += '<button class="x" data-act="clear" data-q="' + q.id + '">✕</button>';
    if (ai && ev) h += '<span class="ev">근거: ' + esc(ev.text) + '</span>';
    h += '</div>';
  }
  if (inModal) {
    h += '<div class="ans' + (v ? (ai ? "" : " doc") : " none") + '">' + esc(v || "답변 없음") + '</div>';
    if (S.editingQ === q.id && !locked() && q.kind === "chips") h += chipsHtml(q, v, true);
    if (q.feeds.length) h += '<div style="margin-top:10px"><span class="feed">' + esc(feed) + '</span></div>';
  } else {
    if (q.kind === "chips") h += chipsHtml(q, v);
    else h += '<input class="num" data-act="numin" data-q="' + q.id + '" value="' + esc(v || "") + '" placeholder="직접 입력"' + (locked() ? " disabled" : "") + '>';
  }
  return h + '</div></div>';
}

function fieldWrap(id, inner, cls){
  const sel = S.modalOpen && S.tab === "review" && S.sel === id;

  let h = '<div class="' + (cls || "f") + (sel ? " sel" : "") + (click ? " click" : "") + '" data-act="field" data-f="' + id + '">' + inner;
  if (sel) h += '<div class="src">' + esc(srcText(id)) + '</div>';

    h += '<div class="hold"><div class="hh" data-act="hold"><span>수술 경로</span><span class="st ' + (c.hold.label.indexOf("보류") >= 0 ? "warn" : "ok") + '">' + c.hold.label + '</span><span style="margin-left:auto;color:var(--ink4)">' + (S.holdOpen ? "▴" : "▾") + '</span></div>';
    if (S.holdOpen) {
      h += '<div class="in">' + c.hold.text + '<div style="margin-top:8px">' + c.hold.items.map(i => '<div style="padding:4px 0"><i>' + i.no + '</i>' + i.text + '</div>').join("") + '</div></div>';
    }
    h += '</div></div>';
  }
  h += '<div class="mright' + (review ? "" : " prev") + '">';
  if (review) h += '<div class="rtitle"><b>환자에게 보일 리포트</b><span>왼쪽 항목과 1:1로 연결됩니다</span></div>';
  else h += '<div class="prevbanner"><b>환자에게 발송될 형태입니다</b><span>이 화면에서는 수정할 수 없습니다. 수정이 필요하면 검토로 돌아가세요.</span></div>';
  h += reportHtml();
  if (review && S.sel && !lk) {
    const d = fDef(S.sel);
    h += '<div class="editor"><div class="eh"><b>' + esc(d.label) + '</b><span>' + esc(d.note) + '</span><button class="edit" style="margin-left:auto;color:var(--ink3)" data-act="closesel">닫기</button></div>';
    if (d.kind === "text") h += '<textarea rows="3" data-act="ftext" data-f="' + S.sel + '">' + esc(fVal(S.sel)) + '</textarea>';
    else h += '<div style="font-size:13px;color:var(--ink2);line-height:1.6">이 값은 왼쪽 <b>' + esc(d.note) + '</b>의 선택을 바꾸면 함께 바뀝니다.</div>';
    if (S.edits[ck(S.sel)] !== undefined) h += '<button class="btn-out" style="margin-top:10px" data-act="reset">원래대로</button>';
    h += '</div>';
  }
  h += '</div></div>';

  h += '<div class="mfoot"><button class="l" data-act="' + (review ? "close" : "back") + '">' + (review ? "닫기" : "검토로 돌아가기") + '</button>';
  h += '<button class="r" data-act="' + (review ? "toprev" : ((lk || S.sent) ? "close" : "done")) + '">' + (review ? "미리보기로" : ((lk || S.sent) ? "닫기" : "검토 완료")) + '</button>';
  return h + '</div></div></div>';
}

function render(){
  const c = C(), lk = locked();
  const answered = c.questions.filter(q => !!qVal(q.id));
  document.getElementById("stt").innerHTML = '<h4>' + c.recTitle + '</h4>' +
    c.transcript.map(l => '<p class="' + (S.modalOpen && S.tab === "review" && selSrc().indexOf(l.id) >= 0 ? "hit" : "") + '">' + esc(l.text) + '</p>').join("");
  document.getElementById("count").textContent = answered.length + "/" + c.questions.length;
  document.getElementById("headtags").innerHTML =
    Object.keys(CASES).map(k => '<button class="cs' + (k === S.caseKey ? " on" : "") + '" data-act="case" data-k="' + k + '">' + CASES[k].label + '</button>').join("") +
    '<span class="tag-b">' + c.visitTag + '</span>' +
    '<span class="' + ((S.reviewDone || S.sent) ? "tag-g" : "tag-b") + '">' + (S.sent ? "발송 완료" : (S.reviewDone ? "검토 완료" : "작성중")) + '</span>' +
    '<span style="color:var(--ink3)">2026.09.08 15:28</span>';
  document.getElementById("lockbar").innerHTML = lk
    ? '<div class="lockbar"><span>검토 완료 — 수정하려면 검토를 재개하세요</span><button class="btn-out" style="margin-left:auto" data-act="resume">검토 재개</button></div>'
    : (S.sent ? '<div class="lockbar"><span>발송 완료 · 이후 수정 사항은 기록에 반영됩니다</span></div>' : "");
  document.getElementById("qlist").innerHTML = c.questions.map(q => qCard(q, false)).join("");
  const send = document.getElementById("send");
  send.textContent = S.sent ? "발송 완료" : "진료 내용 발송";
  send.className = "send" + (S.reviewDone && !S.sent ? " ready" : "");
  const hint = document.getElementById("hint");
  hint.textContent = S.sent ? "환자에게 발송되었습니다 · 이후 수정 사항은 기록에 반영됩니다."
    : (S.reviewDone ? "검토가 완료되었습니다. 발송할 수 있습니다." : "진료기록 검토를 완료해야 발송할 수 있습니다.");
  hint.className = "hint" + ((S.reviewDone || S.sent) ? " ok" : "");
  document.getElementById("modal").innerHTML = modalHtml();
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  const a = t.dataset.act;
  if (a === "pick") {
    if (locked()) return;
    const q = qDef(t.dataset.q), o = t.dataset.o;
    S.picks[ck(q.id)] = qVal(q.id) === o ? null : o;
    if (q.feeds.length) S.sel = q.feeds[0];
  }
  else if (a === "clear") { if (!locked()) S.picks[ck(t.dataset.q)] = null; }
  else if (a === "focus") { const q = qDef(t.dataset.q); S.sel = q.feeds.length ? q.feeds[0] : null; }
  else if (a === "edit") { const q = qDef(t.dataset.q); S.editingQ = S.editingQ === q.id ? null : q.id; if (q.feeds.length) S.sel = q.feeds[0]; }
  else if (a === "field") { if (S.modalOpen && S.tab === "review") S.sel = S.sel === t.dataset.f ? null : t.dataset.f; }
  else if (a === "case") { S.caseKey = t.dataset.k; S.sel = null; S.editingQ = null; }
  else if (a === "tab") { S.tab = t.dataset.t; if (S.tab === "preview") { S.sel = null; S.editingQ = null; } }
  else if (a === "hold") S.holdOpen = !S.holdOpen;
  else if (a === "resume") S.reviewDone = false;
  else if (a === "close") { S.modalOpen = false; S.sel = null; S.editingQ = null; }
  else if (a === "back") S.tab = "review";
  else if (a === "toprev") { S.tab = "preview"; S.sel = null; S.editingQ = null; }
  else if (a === "done") { S.reviewDone = true; S.modalOpen = false; }
  else if (a === "closesel") S.sel = null;
  else if (a === "reset") delete S.edits[ck(S.sel)];
  else return;
  render();
});
document.getElementById("openModal").addEventListener("click", () => { S.modalOpen = true; S.tab = "review"; render(); });
document.getElementById("send").addEventListener("click", () => { if (S.reviewDone && !S.sent) { S.sent = true; render(); } });
document.addEventListener("input", e => {
  const t = e.target.closest("[data-act]");
  if (!t) return;
  if (t.dataset.act === "numin") { if (locked()) return; S.picks[ck(t.dataset.q)] = t.value; }
  else if (t.dataset.act === "ftext") { S.edits[ck(t.dataset.f)] = t.value; const s = t.selectionStart; render(); const n = document.querySelector('[data-act="ftext"]'); if (n) { n.focus(); n.setSelectionRange(s, s); } }
});
render();
</script>
</body>
</html>
