<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACLP-4480 목업 ① 환자 관리 페이지</title>
<style>
  :root{
    --blue:#1E5AF0;
    --blue-hover:#1749c9;
    --navy:#0B1F45;
    --ink:#111827;
    --gray-700:#374151;
    --gray-500:#6B7280;
    --gray-400:#9CA3AF;
    --gray-300:#D1D5DB;
    --gray-200:#E5E7EB;
    --gray-100:#F3F4F6;
    --gray-50:#F9FAFB;
    --sky:#EEF4FF;
    --red:#E03131;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    background:#fff;color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;
  }
  .review-bar{
    position:fixed;bottom:20px;right:20px;z-index:100;display:flex;gap:8px;align-items:center;
    background:rgba(17,24,39,.92);color:#fff;padding:10px 14px;border-radius:10px;
    font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.24);
  }
  .review-bar button{
    background:var(--blue);color:#fff;border:0;border-radius:6px;padding:6px 12px;
    font-size:12px;cursor:pointer;font-family:inherit;
  }
  .review-bar button:hover{background:var(--blue-hover);}
  body.show-new .is-new{outline:2px dashed var(--red);outline-offset:2px;border-radius:6px;}
  body.show-new .is-new::after{
    content:"신규";position:absolute;top:-9px;right:-6px;background:var(--red);color:#fff;
    font-size:9px;line-height:1;padding:3px 5px;border-radius:4px;letter-spacing:.02em;
  }
  .is-new{position:relative;}

  .staging{
    position:absolute;top:6px;left:14px;font-family:ui-monospace,Menlo,monospace;
    font-size:13px;color:#F08C8C;letter-spacing:.04em;z-index:5;
  }
  .app{display:flex;min-height:100vh;}

  .sidebar{
    width:72px;flex:0 0 72px;border-right:1px solid var(--gray-200);
    display:flex;flex-direction:column;align-items:center;padding:14px 0 18px;background:#fff;
  }
  .sb-toggle{color:var(--gray-500);margin-bottom:18px;}
  .sb-nav{display:flex;flex-direction:column;gap:6px;flex:1;}
  .sb-item{
    width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    color:var(--gray-500);cursor:pointer;
  }
  .sb-item:hover{background:var(--gray-100);}
  .sb-item.active{background:var(--sky);color:var(--blue);}
  .sb-bottom{display:flex;flex-direction:column;gap:6px;}

  .main{flex:1;min-width:0;background:#fff;display:flex;flex-direction:column;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 32px 14px;
  }
  .crumb{color:var(--gray-400);font-size:14px;}
  .crumb b{color:var(--gray-500);font-weight:500;}
  .top-actions{display:flex;gap:10px;}
  .btn-primary{
    background:var(--blue);color:#fff;border:0;border-radius:8px;padding:10px 18px;
    font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
  }
  .btn-primary:hover{background:var(--blue-hover);}

  .content{padding:0 32px 40px;}

  .filter-card{
    background:var(--gray-50);border:1px solid var(--gray-200);border-radius:12px;
    padding:20px 22px;display:flex;gap:18px;align-items:flex-end;flex-wrap:wrap;
  }
  .field{display:flex;flex-direction:column;gap:8px;}
  .field label{font-size:13px;color:var(--gray-700);font-weight:500;}
  .field input,.field select{
    height:40px;border:1px solid var(--gray-300);border-radius:8px;padding:0 12px;
    font-size:14px;font-family:inherit;background:#fff;color:var(--ink);min-width:170px;
  }
  .field input::placeholder{color:var(--gray-400);}
  .field select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%236B7280' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px;}
  .btn-search{
    height:40px;background:var(--ink);color:#fff;border:0;border-radius:8px;padding:0 20px;
    font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;font-family:inherit;
  }
  .btn-reset{
    height:40px;background:none;border:0;color:var(--gray-500);font-size:14px;cursor:pointer;
    display:flex;align-items:center;gap:6px;font-family:inherit;
  }

  .result-count{margin:26px 0 12px;font-size:14px;color:var(--gray-700);}
  .result-count b{color:var(--ink);font-weight:700;margin-left:6px;}

  table{width:100%;border-collapse:collapse;background:#fff;}
  thead th{
    background:var(--gray-50);color:var(--gray-500);font-size:13px;font-weight:500;text-align:left;
    padding:14px 16px;border-top:1px solid var(--gray-200);border-bottom:1px solid var(--gray-200);
    white-space:nowrap;
  }
  tbody td{
    padding:16px;border-bottom:1px solid var(--gray-100);font-size:14px;color:var(--ink);
    vertical-align:middle;
  }
  tbody tr:hover{background:#FAFBFF;}
  .muted{color:var(--gray-400);}
  .bookmark{color:var(--gray-400);cursor:pointer;}
  .badge{
    display:inline-block;background:var(--gray-100);color:var(--gray-500);
    font-size:12px;padding:4px 10px;border-radius:6px;
  }
  .col-report{width:150px;}

  .btn-report{
    display:inline-flex;align-items:center;gap:5px;height:32px;padding:0 12px;
    border:1px solid var(--blue);background:#fff;color:var(--blue);border-radius:8px;
    font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;
  }
  .btn-report:hover{background:var(--sky);}
  .btn-report:disabled{
    border-color:var(--gray-200);background:var(--gray-50);color:var(--gray-400);cursor:not-allowed;
  }

  .pagination{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:28px;}
  .pg{
    min-width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--gray-500);
    font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;
  }
  .pg:hover{background:var(--gray-100);}
  .pg.active{background:var(--ink);color:#fff;font-weight:600;}

  .tip{position:relative;display:inline-block;}
  .tip .tip-body{
    visibility:hidden;opacity:0;transition:.12s;position:absolute;bottom:calc(100% + 8px);right:0;
    background:var(--navy);color:#fff;font-size:12px;line-height:1.5;padding:8px 10px;border-radius:8px;
    white-space:nowrap;z-index:20;font-weight:400;
  }
  .tip:hover .tip-body{visibility:visible;opacity:1;}

  .footnote{
    margin-top:34px;padding-top:18px;border-top:1px solid var(--gray-200);
    font-size:12px;color:var(--gray-400);line-height:1.9;
  }
  .footnote code{
    background:var(--gray-100);color:var(--gray-700);padding:2px 6px;border-radius:4px;
    font-family:ui-monospace,Menlo,monospace;font-size:11px;
  }
</style>
</head>
<body>

<div class="staging">STAGING v1.0.1-1</div>

<div class="app">
  <aside class="sidebar">
    <div class="sb-toggle">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <nav class="sb-nav">
      <div class="sb-item" title="처방 관리"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 2h6v4H9z"/><path d="M9 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-3"/><path d="M8 12h8M8 16h5"/></svg></div>
      <div class="sb-item active" title="환자 관리"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9.5" r="2.4"/><path d="M16 20a5.6 5.6 0 0 1 5.5-5.4"/></svg></div>
      <div class="sb-item" title="알림"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v2M5 10a7 7 0 0 1 14 0v5l1.5 3H3.5L5 15z"/><path d="M10 21h4"/></svg></div>
      <div class="sb-item" title="환자 등록"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="10" cy="8" r="3.4"/><path d="M3 20a7 7 0 0 1 14 0"/><path d="M19 8v6M16 11h6"/></svg></div>
      <div class="sb-item" title="통계"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4v16h16"/><path d="M8 15l3-4 3 2 4-6"/></svg></div>
      <div class="sb-item" title="모니터링"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg></div>
    </nav>
    <div class="sb-bottom">
      <div class="sb-item" title="계정"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 19a6 6 0 0 1 11 0"/></svg></div>
      <div class="sb-item" title="로그아웃"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"/><path d="M16 16l4-4-4-4M20 12H10"/></svg></div>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="crumb">명지병원 &nbsp;|&nbsp; <b>환자 관리</b></div>
      <div class="top-actions">
        <button class="btn-primary">환자 전입</button>
        <button class="btn-primary">환자 회원가입</button>
      </div>
    </div>

    <div class="content">
      <div class="filter-card">
        <div class="field">
          <label>이름</label>
          <input type="text" placeholder="이름" data-testid="환자-목록-환자명-검색입력">
        </div>
        <div class="field">
          <label>등록번호</label>
          <input type="text" placeholder="등록번호" data-testid="환자-목록-등록번호-검색입력">
        </div>
        <div class="field">
          <label>분류</label>
          <select><option>전체</option></select>
        </div>
        <div class="field">
          <label>가입 상태</label>
          <select><option>전체</option></select>
        </div>
        <div class="field">
          <label>담당 의사</label>
          <select><option>이름</option></select>
        </div>
        <button class="btn-search" data-testid="환자-목록-검색-버튼">
          검색
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        </button>
        <button class="btn-reset">
          초기화
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>

      <div class="result-count">검색 결과 <b>330건</b></div>

      <table>
        <thead>
          <tr>
            <th style="width:80px;">북마크</th>
            <th style="width:110px;">이름</th>
            <th style="width:130px;">등록번호</th>
            <th>프로그램명</th>
            <th style="width:90px;">환측</th>
            <th style="width:110px;">분류</th>
            <th style="width:130px;">담당 의사</th>
            <th style="width:110px;">가입 상태</th>
            <th class="col-report is-new">운동 통합 리포트</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>

      <div class="pagination">
        <button class="pg">&laquo;</button>
        <button class="pg">&lsaquo;</button>
        <button class="pg active">1</button>
        <button class="pg">2</button>
        <button class="pg">3</button>
        <button class="pg">4</button>
        <button class="pg">5</button>
        <button class="pg">&rsaquo;</button>
        <button class="pg">&raquo;</button>
      </div>

      <div class="footnote">
        ACLP-4480 목업 ① 환자 관리 페이지 · 신규 요소는 <b>운동 통합 리포트</b> 컬럼 1개<br>
        AC-1 진입 경로 / AC-3 활성 프로그램 없음 · AC-23 프로그램 종료 시 조회 불가 · 키 <code>환자-목록-리포트조회-버튼</code>
      </div>
    </div>
  </main>
</div>

<div class="review-bar">
  <span>신규 요소 강조</span>
  <button id="toggleNew">켜기</button>
</div>

<script>
  var rows = [
    {name:"test2",   no:"123456",   program:"무릎 기능 관리 프로그램 | 골관절염 4기 운동 플랜",     side:"왼쪽",  doctor:"김진구"},
    {name:"test1",   no:"12345",    program:null,                                                side:null,   doctor:"김진구"},
    {name:"노두현",   no:"123123",   program:"무릎 기능 관리 프로그램 | 골관절염 1기 운동 플랜",     side:"오른쪽", doctor:"노두현 명…"},
    {name:"전봉래",   no:"00706364", program:"무릎 기능 회복 프로그램 | 근위 경골 절골술 운동 플랜",  side:"왼쪽",  doctor:"김진구"},
    {name:"킹도엉",   no:"0910test", program:null,                                                side:null,   doctor:"김진구"},
    {name:"이흥숙",   no:"00377402", program:"무릎 기능 관리 프로그램 | 일반건강증진 운동 플랜",      side:"오른쪽", doctor:"김진구"},
    {name:"고명주",   no:"01040611", program:"무릎 기능 관리 프로그램 | 골관절염 2기 운동 플랜",     side:"왼쪽",  doctor:"김진구"},
    {name:"비야보로…", no:"1419337",  program:"무릎 기능 회복 프로그램 | 반월연골판 절제술 운동 플랜", side:"오른쪽", doctor:"테스트"},
    {name:"임태연",   no:"01404342", program:"무릎 기능 회복 프로그램 | 후방십자인대 재건술 운동 플랜",side:"오른쪽", doctor:"김진구"},
    {name:"유을상",   no:"01403459", program:"무릎 기능 관리 프로그램 | 골관절염 3기 운동 플랜",     side:"오른쪽", doctor:"김진구"}
  ];

  var bookmarkSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 4h12v17l-6-4.2L6 21z"/></svg>';
  var reportSvg   = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v16h16"/><path d="M8 15l3-4 3 2 4-6"/></svg>';

  var html = "";
  for (var i = 0; i < rows.length; i++) {
    var r = rows[i];
    var active = r.program !== null;
    var btn;
    if (active) {
      btn = '<button class="btn-report" data-testid="환자-목록-리포트조회-버튼">' + reportSvg + '조회</button>';
    } else {
      btn = '<span class="tip">' +
              '<button class="btn-report" disabled data-testid="환자-목록-리포트조회-버튼">' + reportSvg + '조회</button>' +
              '<span class="tip-body">활성 프로그램이 없어 조회할 수 없습니다</span>' +
            '</span>';
    }
    html += '<tr>' +
      '<td><span class="bookmark">' + bookmarkSvg + '</span></td>' +
      '<td>' + r.name + '</td>' +
      '<td>' + r.no + '</td>' +
      '<td>' + (r.program ? r.program : '<span class="muted">-</span>') + '</td>' +
      '<td>' + (r.side ? r.side : '<span class="muted">-</span>') + '</td>' +
      '<td><span class="muted">-</span></td>' +
      '<td>' + r.doctor + '</td>' +
      '<td><span class="badge">완료</span></td>' +
      '<td class="col-report is-new">' + btn + '</td>' +
    '</tr>';
  }
  document.getElementById("tbody").innerHTML = html;

  var on = false;
  document.getElementById("toggleNew").addEventListener("click", function () {
    on = !on;
    document.body.classList.toggle("show-new", on);
    this.textContent = on ? "끄기" : "켜기";
  });
</script>

</body>
</html>
